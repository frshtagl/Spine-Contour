name: Spinopelvic research checks

on:
  push:
    branches:
      - research/spinopelvic-lab
  pull_request:
    branches:
      - research/spinopelvic-lab

permissions:
  contents: read

jobs:
  synthetic-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/spinopelvic/requirements-research-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r research/spinopelvic/requirements-research-test.txt
      - name: Compile research Python modules
        run: python -m compileall -q research/spinopelvic/tools research/spinopelvic/analysis
      - name: Validate committed JSON and shell scripts
        run: |
          find research/spinopelvic -type f -name '*.json' -print0 | xargs -0 -r -n1 python -m json.tool >/dev/null
          bash -n research/spinopelvic/tools/import_source_bundle.sh
      - name: Run synthetic tests only
        run: python -m unittest discover -s research/spinopelvic/tests -v
