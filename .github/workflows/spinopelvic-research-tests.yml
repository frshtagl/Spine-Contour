name: Spinopelvic research checks

on:
  push:
    branches:
      - research/spinopelvic-lab
  pull_request:
    branches:
      - research/spinopelvic-lab

permissions:
  contents: read

jobs:
  synthetic-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/spinopelvic/requirements-research-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r research/spinopelvic/requirements-research-test.txt
      - name: Run synthetic tests only
        run: python -m unittest discover -s research/spinopelvic/tests -v
